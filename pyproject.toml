[project]
name = "nl-jobs"
version = "0.1.0"
description = "Daily pipeline for Dutch tech job postings, joined against the IND sponsor register."
readme = "README.md"
authors = [{ name = "Atai Nogoibaev" }]
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added per checkpoint, each with a stated reason.
dependencies = [
    "httpx[brotli]>=0.28",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "B",   # bugbear: common Python pitfalls
    "UP",  # pyupgrade: prefer modern syntax for the target version
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: needs a running Postgres (make up)",
]
